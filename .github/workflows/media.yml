name: bruce-media-fetch
# Bruce pushes jobs/<slug>.json; this job downloads Pixabay photos and b-roll plus
# screenshots of the source articles, then force-pushes them to the media-cache branch
# (one commit, no history, so main stays small).
on:
  push:
    branches: [main]
    paths: ["jobs/**"]
  workflow_dispatch:
    inputs:
      job:
        description: "Job file, e.g. jobs/2026-11-06-topic.json (blank = newest)"
        required: false
permissions:
  contents: write
concurrency:
  group: media-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright/python:v1.48.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install
        run: python3 -m pip install -q --break-system-packages playwright==1.48.0 imageio-ffmpeg
      - name: Fetch media
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$JOB" ]; then JOB=$(git diff --name-only HEAD~1 HEAD -- jobs | tail -1); fi
          export JOB
          python3 engine/fetch_media.py
      - name: Publish to media-cache branch
        run: |
          cd out
          git config --global --add safe.directory "$PWD"
          git init -q -b media-cache
          git -c user.name="Bruce" -c user.email="noreply@anthropic.com" add -A
          git -c user.name="Bruce" -c user.email="noreply@anthropic.com" commit -qm "media for $(ls)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media-cache
